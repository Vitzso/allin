<!doctype html>
<!-- The picture at the top of the README. npm run screenshots renders it twice, light and dark
     (banner.html?dark), after taking docs/images/today.png, which it shows on the right. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --page: #f4f6f5;
        --ink: #1f2a2a;
        --soft: #5d6a69;
        --line: #e3e8e6;
        --green: #257559;
        --mint: #bbedc9;
        --chip: #ffffff;
      }
      .dark {
        --page: #0f1715;
        --ink: #f1f5f3;
        --soft: #a3b1ad;
        --line: #24302c;
        --green: #3f9a78;
        --chip: #17211e;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 1280px;
        height: 440px;
        overflow: hidden;
        background: var(--page);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
        display: flex;
        align-items: center;
      }
      .words {
        width: 560px;
        padding-left: 72px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .brand svg {
        width: 60px;
        height: 60px;
      }
      .brand span {
        font-size: 50px;
        font-weight: 500;
        letter-spacing: -2px;
      }
      .brand i {
        font-style: normal;
        color: var(--green);
      }
      h1 {
        margin: 34px 0 0;
        font-size: 43px;
        line-height: 1.12;
        font-weight: 500;
        letter-spacing: -1.4px;
      }
      p {
        margin: 18px 0 0;
        font-size: 20px;
        line-height: 1.5;
        color: var(--soft);
      }
      ul {
        display: flex;
        gap: 10px;
        margin: 30px 0 0;
        padding: 0;
        list-style: none;
      }
      li {
        padding: 8px 15px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--chip);
        font-size: 16px;
        color: var(--ink);
      }
      .shot {
        position: absolute;
        left: 640px;
        top: 56px;
        width: 760px;
        border-radius: 16px;
        border: 1px solid var(--line);
        box-shadow:
          0 30px 60px rgba(16, 40, 32, 0.16),
          0 4px 12px rgba(16, 40, 32, 0.08);
        overflow: hidden;
        transform: rotate(-1.2deg);
      }
      .dark .shot {
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
      }
      .shot img {
        display: block;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div class="words">
      <div class="brand">
        <svg viewBox="0 0 40 40" aria-hidden="true">
          <rect width="40" height="40" rx="12" fill="#257559" />
          <path d="M10 28 18 12h4l8 16h-5l-5-11-5 11Z" fill="white" />
          <circle cx="20" cy="26" r="2" fill="#bbedc9" />
        </svg>
        <span>allin<i>.</i></span>
      </div>
      <h1>Your day, in perspective.</h1>
      <p>Tasks, health and markets in one calm place that stays on your own machine.</p>
      <ul>
        <li>Encrypted vault</li>
        <li>No cloud account</li>
        <li>Offline by default</li>
      </ul>
    </div>
    <div class="shot"><img src="../docs/images/today.png" alt="" /></div>
    <script>
      if (location.search.includes('dark')) document.body.classList.add('dark');
    </script>
  </body>
</html>
